name: V3.2-106 disposable PostgreSQL checkpoint transaction tests
on:
  pull_request:
    paths:
      - 'tests/fixtures/v3-2-106-m02-isolated-postgres.sql'
      - 'tests/helpers/v3-2-106-m02-postgres-checkpoint.mjs'
      - 'tests/integration/v3-2-106-m02-postgres-checkpoint.test.mjs'
      - 'scripts/v3-2-106-setup-isolated-pg.mjs'
      - 'spec/v3-2-106-m02-postgresql-checkpoint.json'
      - 'docs/V3.2-106_M02_ISOLATED_POSTGRESQL_CHECKPOINT.md'
      - '.github/workflows/v3-2-106-postgresql-checkpoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgresql-contract:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: v106_isolated
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-v106-admin-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v106_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      V106_ISOLATED_PG: YES_TEST_ONLY
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned runtime dependencies without changing repo lock files
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Check fixture and transaction code syntax
        run: |
          node --check scripts/v3-2-106-setup-isolated-pg.mjs
          node --check tests/helpers/v3-2-106-m02-postgres-checkpoint.mjs
          node --check tests/integration/v3-2-106-m02-postgres-checkpoint.test.mjs
      - name: Create isolated database schema and limited test-only roles
        run: node scripts/v3-2-106-setup-isolated-pg.mjs
      - name: Run real disposable PostgreSQL DB-01 through DB-08 contract checks
        run: node --test tests/integration/v3-2-106-m02-postgres-checkpoint.test.mjs
      - name: Verify production rights remain disabled
        run: |
          node --input-type=module -e "import{readFileSync}from'node:fs';const x=JSON.parse(readFileSync('spec/v3-2-106-m02-postgresql-checkpoint.json'));if(x.parent_pr!==112||x.db_acceptance.length!==8||x.database.production_migration_created!==false||x.external_authority_verified!==false||x.finance_authorized!==false||x.academic_authorized!==false||x.handoff_allowed!==false||x.compensation_write_allowed!==false||x.release_eligible!==false||x.hold_active!==true||x.merge_authorized!==false||x.deploy_authorized!==false||x.external_contract_status!=='proposed-unimplemented')process.exit(1)"
      - name: Recheck V3.2-105 unresolved external evidence
        run: node --test tests/security/v3-2-105-m02-admission-contract-review.test.mjs
      - name: Regress V3.2-104 source trust-fence test fixtures
        run: node --test tests/security/v3-2-104-m02-source-trust-fence.test.mjs
      - name: Run V3.2-82 through V3.2-99 offline security regressions
        run: node scripts/v3-2-100-run-m02-node-regressions.mjs
