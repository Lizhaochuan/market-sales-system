name: V3.2-116 signed HOLD outbox and negative-only receipt
on:
  pull_request:
    paths:
      - 'src/cross-module-hold-outbox-protocol.mjs'
      - 'tests/integration/v3-2-116-m02-hold-outbox-delivery.test.mjs'
      - 'tests/helpers/v3-2-116-m02-postgres-hold-outbox.mjs'
      - 'tests/fixtures/v3-2-116-m02-hold-outbox.sql'
      - 'scripts/v3-2-116-setup-hold-outbox.mjs'
      - 'spec/v3-2-116-m02-signed-hold-outbox.json'
      - 'docs/V3.2-116_M02_SIGNED_HOLD_OUTBOX.md'
      - '.github/workflows/v3-2-116-signed-hold-outbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-signed-hold-outbox:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: v106_isolated
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-v106-admin-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v106_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      V106_ISOLATED_PG: YES_TEST_ONLY
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable runner dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Syntax-check source and isolated SQL modules
        run: |
          node --check src/cross-module-hold-outbox-protocol.mjs
          node --check tests/helpers/v3-2-116-m02-postgres-hold-outbox.mjs
          node --check tests/integration/v3-2-116-m02-hold-outbox-delivery.test.mjs
          node --check scripts/v3-2-116-setup-hold-outbox.mjs
      - name: Initialize disposable V106 V109 V110 V112 V113 V114 V115 and V116 fixtures
        run: |
          node scripts/v3-2-106-setup-isolated-pg.mjs
          node scripts/v3-2-109-setup-lease-sql.mjs
          node scripts/v3-2-110-setup-loss-notice-sql.mjs
          node scripts/v3-2-112-setup-evidence-intake-sql.mjs
          node scripts/v3-2-113-setup-reviewer-assignments.mjs
          node scripts/v3-2-114-setup-reviewer-lifecycle.mjs
          node scripts/v3-2-115-setup-review-hold.mjs
          node scripts/v3-2-116-setup-hold-outbox.mjs
      - name: Run V116 signed outbox and negative-only receipt PostgreSQL scenarios
        run: node --test tests/integration/v3-2-116-m02-hold-outbox-delivery.test.mjs
      - name: Regress V115 permanent HOLD and V114 reviewer recusal lifecycle
        run: node --test tests/integration/v3-2-115-m02-review-invalidation-hold.test.mjs tests/integration/v3-2-114-m02-reviewer-recusal-replacement.test.mjs
      - name: Regress V113 reviewer assignment V112 evidence intake and V111 signed independent domains
        run: node --test tests/integration/v3-2-113-m02-independent-reviewer-assignment.test.mjs tests/integration/v3-2-112-m02-evidence-intake-quarantine.test.mjs tests/security/v3-2-111-m02-independent-evidence-review.test.mjs
      - name: Regress V110 negative notice V109 lease and V108 causal race
        run: node --test tests/integration/v3-2-110-m02-lease-loss-negative-receipt.test.mjs tests/integration/v3-2-109-m02-causal-lease-fence.test.mjs tests/integration/v3-2-108-m02-postcommit-causal-race.test.mjs
      - name: Regress V107 signed PostgreSQL and V106 durable checkpoint
        run: node --test tests/integration/v3-2-107-m02-signed-postgres-e2e.test.mjs tests/integration/v3-2-106-m02-postgres-checkpoint.test.mjs
      - name: Confirm all real external authority and business approvals remain blocked
        run: |
          node --input-type=module -e "import{readFileSync}from'node:fs';const s=JSON.parse(readFileSync('spec/v3-2-116-m02-signed-hold-outbox.json'));const d=s.hard_denials;if(s.parent_pr!==122||s.cases.length!==20||s.negative_receipt_contract.no_positive_receipt_format!==true||s.message_contract.external_transport_attempted!==false||s.sql_boundary.v115_hold_and_v116_outbox_atomically_written_together!==false||s.sql_boundary.production_migration_created!==false||s.safety.status_of_external_contract!=='proposed-unimplemented'||Object.entries(d).some(([k,v])=>k==='hold_active'?v!==true:v!==false))process.exit(1)"
      - name: Recheck V105 external admission evidence remains unverified
        run: node --test tests/security/v3-2-105-m02-admission-contract-review.test.mjs
      - name: Regress eighteen V82 through V99 isolated security suites
        run: node scripts/v3-2-100-run-m02-node-regressions.mjs
