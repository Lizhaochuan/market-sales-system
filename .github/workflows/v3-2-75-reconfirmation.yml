name: V3.2-75 isolated recovery reconfirmation regression
on:
  pull_request:
    paths:
      - 'src/cross-module-recovery-reconfirmation.mjs'
      - 'tests/security/v3-2-75-m02-reconfirmation.test.mjs'
      - '.github/workflows/v3-2-75-reconfirmation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-reconfirmation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated evidence reconfirmation syntax
        run: node --check src/cross-module-recovery-reconfirmation.mjs
      - name: Test isolation, stale versions, two-person review and non-authorization
        run: node --test tests/security/v3-2-75-m02-reconfirmation.test.mjs
