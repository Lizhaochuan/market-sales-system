name: V3.2-80 isolated supplement independent review
on:
  pull_request:
    paths:
      - 'src/cross-module-supplement-independent-review.mjs'
      - 'tests/security/v3-2-80-m02-supplement-independent-review.test.mjs'
      - '.github/workflows/v3-2-80-supplement-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-supplement-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate supplement independent review syntax
        run: node --check src/cross-module-supplement-independent-review.mjs
      - name: Run review, supplement chain and original preparation tests
        run: node --test tests/security/v3-2-80-m02-supplement-independent-review.test.mjs tests/security/v3-2-79-m02-supplement-version-chain.test.mjs tests/security/v3-2-78-m02-manual-acceptance-preparation.test.mjs
