name: V3.2-78 isolated manual acceptance preparation
on:
  pull_request:
    paths:
      - 'src/cross-module-manual-acceptance-preparation.mjs'
      - 'tests/security/v3-2-78-m02-manual-acceptance-preparation.test.mjs'
      - '.github/workflows/v3-2-78-manual-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-manual-preparation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preparation source syntax
        run: node --check src/cross-module-manual-acceptance-preparation.mjs
      - name: Run independent actor, snapshot and historical safety regression
        run: node --test tests/security/v3-2-78-m02-manual-acceptance-preparation.test.mjs tests/security/v3-2-77-m02-handoff-gap-report.test.mjs
