name: V3.2-86 isolated reopened evidence diff
on:
  pull_request:
    paths:
      - 'src/cross-module-reopened-evidence-diff.mjs'
      - 'tests/security/v3-2-86-m02-reopened-evidence-diff.test.mjs'
      - '.github/workflows/v3-2-86-evidence-diff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check diff source syntax
        run: node --check src/cross-module-reopened-evidence-diff.mjs
      - name: Run evidence diff and reopened triage tests
        run: node --test tests/security/v3-2-86-m02-reopened-evidence-diff.test.mjs tests/security/v3-2-85-m02-triage-reopen.test.mjs
