name: V3.2-73 isolated revocation race regression
on:
  pull_request:
    paths:
      - 'src/cross-module-revocation-race-preflight.mjs'
      - 'src/cross-module-evidence-revocation-ledger.mjs'
      - 'tests/security/v3-2-73-m02-revocation-race.test.mjs'
      - 'tests/security/v3-2-72-m02-evidence-revocation.test.mjs'
      - '.github/workflows/v3-2-73-revocation-race.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check src/cross-module-revocation-race-preflight.mjs
          node --check src/cross-module-evidence-revocation-ledger.mjs
      - name: Run isolated withdrawal and race tests
        run: node --test tests/security/v3-2-72-m02-evidence-revocation.test.mjs tests/security/v3-2-73-m02-revocation-race.test.mjs
