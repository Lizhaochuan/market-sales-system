name: V3.2 isolated core business API

on:
  pull_request:
    branches: [main, chatgpt/v3-1-04-integration-review, chatgpt/v3-2-01-core-crm-business, chatgpt/v3-2-02-chinese-admin-ui, chatgpt/v3-2-03-identity-family-approval, chatgpt/v3-2-04-identity-governance, chatgpt/v3-2-05-isolated-runtime-rls, chatgpt/v3-2-06-principal-tenant-boundary, chatgpt/v3-2-07-trusted-identity-routing, chatgpt/v3-2-08-approved-routing-staff-scope, chatgpt/v3-2-09-scoped-read-business-api, chatgpt/v3-2-10-legacy-read-hardening, chatgpt/v3-2-11-student-access-governance, chatgpt/v3-2-12-chinese-access-ui-lowrisk-writes, chatgpt/v3-2-13-legacy-lowrisk-writes-trusted-ui, chatgpt/v3-2-14-scoped-contact-links-consultations, chatgpt/v3-2-15-scoped-identity-directory, chatgpt/v3-2-16-custody-withdrawals-disputes, chatgpt/v3-2-17-consultation-lead-candidate, chatgpt/v3-2-18-conversion-preflight-attribution-dispute, chatgpt/v3-2-19-final-approved-lead-conversion, chatgpt/v3-2-20-student-link-and-lead-corrections, chatgpt/v3-2-21-verified-student-link-withdrawal, chatgpt/v3-2-22-downstream-student-correction-hold, chatgpt/v3-2-23-downstream-reconciliation-release, chatgpt/v3-2-24-cross-module-correction-design, chatgpt/v3-2-25-three-party-plan-approvals, chatgpt/v3-2-26-compensation-manifest-preflight, chatgpt/v3-2-27-authority-contracts-readonly-gate, chatgpt/v3-2-28-readonly-source-trust-preparation, chatgpt/v3-2-29-source-registration-readiness, chatgpt/v3-2-30-isolated-source-recovery, chatgpt/v3-2-31-integration-readiness-hard-gates, chatgpt/v3-2-32-uat-handbook-blocker-report, chatgpt/v3-2-33-isolated-uat-preview-console, chatgpt/v3-2-34-uat-evidence-diff-audit, chatgpt/v3-2-35-freeze-revocation-consistency, chatgpt/v3-2-36-cross-module-handover-baseline, chatgpt/v3-2-37-integration-dependency-preflight, chatgpt/v3-2-38-migration-object-conflict-audit, chatgpt/v3-2-39-permissions-tenant-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ms_test
          POSTGRES_PASSWORD: isolated_test_only_password
          POSTGRES_DB: ms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ms_test -d ms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MS_STAGE: isolated-test
      DATABASE_URL: postgresql://ms_test:isolated_test_only_password@127.0.0.1:5432/ms_test
      AUTH_HMAC_SECRET: fictional-test-only-strong-token-secret-9c92789dc3b9
      AUTH_ISSUER: market-sales-test-issuer
      DEV_LOGIN_SECRET: fictional-strong-ui-demo-passphrase-0001
      PGPASSWORD: isolated_test_only_password
      RUNTIME_TEST_PASSWORD: fictional_ci_runtime_2026_9f36a672
      RUNTIME_TEST_PASSWORD_B: fictional_ci_runtime_b_2026_3b81cf20
      DATABASE_URL_ROUTE_DIRECTORY: postgresql://ms_approved_route_login:fictional_approved_route_2026_8136bc@127.0.0.1:5432/ms_test
      DATABASE_URL_ASSIGNEE_A: postgresql://ms_assignee_reader_a:fictional_assignee_a_2026_74e5a9@127.0.0.1:5432/ms_test
      DATABASE_URL_ASSIGNEE_B: postgresql://ms_assignee_reader_b:fictional_assignee_b_2026_129b6e@127.0.0.1:5432/ms_test
      DATABASE_URL_ASSIGNEE_MANAGER: postgresql://ms_assignee_reader_manager:fictional_assignee_manager_2026_0bc5ea@127.0.0.1:5432/ms_test
      DATABASE_URL_ASSIGNEE_MANAGER_2: postgresql://ms_assignee_reader_manager_2:fictional_assignee_manager2_2026_d28b57@127.0.0.1:5432/ms_test
      DATABASE_URL_ACCESS_A: postgresql://ms_access_a:fictional_access_a_2026_982a1e@127.0.0.1:5432/ms_test
      DATABASE_URL_ACCESS_B: postgresql://ms_access_b:fictional_access_b_2026_819a0f@127.0.0.1:5432/ms_test
      DATABASE_URL_ACCESS_MANAGER: postgresql://ms_access_manager:fictional_access_manager_2026_15be2c@127.0.0.1:5432/ms_test
      DATABASE_URL_AUTH_DIRECTORY: postgresql://ms_strict_auth_login:fictional_auth_directory_2026_12f4c8@127.0.0.1:5432/ms_test
      DATABASE_URL_WRITE_A: postgresql://ms_write_a:fictional_write_a_2026_618f92@127.0.0.1:5432/ms_test
      DATABASE_URL_WRITE_MANAGER: postgresql://ms_write_manager:fictional_write_manager_2026_6b31e2@127.0.0.1:5432/ms_test
      DATABASE_URL_WRITE_MANAGER_2: postgresql://ms_write_manager_2:fictional_write_manager2_2026_f971a6@127.0.0.1:5432/ms_test
      DATABASE_URL_PLAN_A: postgresql://ms_plan_requester_a:fictional_plan_a_2026_abc127@127.0.0.1:5432/ms_test
      DATABASE_URL_PLAN_SALES: postgresql://ms_plan_sales_reviewer:fictional_plan_sales_2026_def238@127.0.0.1:5432/ms_test
      DATABASE_URL_SOURCE_SECURITY: postgresql://ms_fixture_source_security:fictional_source_security_2026_guard@127.0.0.1:5432/ms_test
      DATABASE_URL_UAT_PREVIEW_A: postgresql://ms_uat_preview_a:fictional_uat_preview_a_2026@127.0.0.1:5432/ms_test
      DATABASE_URL_UAT_PREVIEW_B: postgresql://ms_uat_preview_b:fictional_uat_preview_b_2026@127.0.0.1:5432/ms_test
      DATABASE_URL_PLAN_FINANCE: postgresql://ms_plan_finance_reviewer:fictional_plan_finance_2026_ghi349@127.0.0.1:5432/ms_test
      DATABASE_URL_PLAN_ACADEMIC: postgresql://ms_plan_academic_reviewer:fictional_plan_academic_2026_jkl450@127.0.0.1:5432/ms_test
      DATABASE_URL_PLAN_DUAL: postgresql://ms_plan_dual_reviewer:fictional_plan_dual_2026_mno561@127.0.0.1:5432/ms_test
      DATABASE_URL_PLAN_PREFLIGHT: postgresql://ms_plan_preflight_independent:fictional_plan_preflight_2026_se719@127.0.0.1:5432/ms_test
      DATABASE_URL_PLAN_B: postgresql://ms_plan_finance_b:fictional_plan_b_2026_pqr672@127.0.0.1:5432/ms_test
      DATABASE_URL_WRITE_B: postgresql://ms_write_b:fictional_write_b_2026_a0c33f@127.0.0.1:5432/ms_test
      DATABASE_URL_DIRECTORY_A: postgresql://ms_directory_reader_a:fictional_viewonly_a_2026_d2ea45@127.0.0.1:5432/ms_test
      DATABASE_URL_DIRECTORY_B: postgresql://ms_directory_reader_b:fictional_viewonly_b_2026_c72180@127.0.0.1:5432/ms_test
      DATABASE_URL_RESTRICTED: postgresql://ms_isolated_api:fictional_ci_runtime_2026_9f36a672@127.0.0.1:5432/ms_test
      DATABASE_URL_RESTRICTED_B: postgresql://ms_isolated_api_b:fictional_ci_runtime_b_2026_3b81cf20@127.0.0.1:5432/ms_test
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: ms_test
      PGUSER: ms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PostgreSQL client library
        run: npm install --no-audit --no-fund
      - name: Install isolated Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Create isolated schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_initial_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/002_financial_integrity_draft.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/003_low_risk_api_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/004_contact_event_owner_scope.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/005_unique_consultation_lead.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/006_identity_family_review.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/007_identity_change_governance.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/008_lowrisk_runtime_permissions.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/009_isolated_tenant_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/fictional_ui_demo_seed.sql
      - name: Create isolated nonowner PostgreSQL application LOGIN
        run: |
          psql -X -v ON_ERROR_STOP=1 -v "app_password=$RUNTIME_TEST_PASSWORD" -f tests/sql/create_isolated_runtime_login.sql
      - name: Replace GUC tenant scopes with trusted database principal mapping
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/010_database_principal_tenant_boundary.sql
          psql -X -v ON_ERROR_STOP=1 -v "app_password_b=$RUNTIME_TEST_PASSWORD_B" -f tests/sql/create_second_tenant_principal.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/011_student_directory_read_projection.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/012_approved_identity_directory_staff_projection.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/013_employee_scoped_read_business_views.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/014_legacy_sales_scoped_read_details.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/015_student_access_governance.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/016_access_ui_choices_and_scoped_lowrisk_writes.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/017_scoped_contact_links_consultations.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/018_strict_function_only_auth_directory.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/019_independent_contact_custody_approval.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/020_contact_custody_review_and_related_student_scope.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/021_consultation_lead_candidate_review.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/022_conversion_preflight_and_attribution_dispute.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/023_final_authorized_scoped_lead_conversion.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/024_lead_student_pending_links_and_adjustments.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/025_independent_student_link_verification_withdrawal.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/026_downstream_student_correction_holds.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/027_two_supervisor_downstream_reconciliation.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/028_three_party_correction_plan_approvals.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/029_compensation_scope_and_blocked_preflight.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/030_untrusted_authority_candidates_and_readonly_gate.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/031_readonly_source_trust_readiness_gate.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/032_fixture_source_registration_readiness.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/033_fixture_source_recovery_incidents.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/034_preintegration_authority_hard_gates.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/035_readonly_integration_uat_report.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/036_scoped_uat_preview_reader.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/037_immutable_fixture_uat_evidence_diff.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/038_fixture_uat_security_freeze_and_consistent_export.sql
          psql -X -v ON_ERROR_STOP=1             -v "route_password=fictional_approved_route_2026_8136bc"             -v "assignee_password_a=fictional_assignee_a_2026_74e5a9"             -v "assignee_password_b=fictional_assignee_b_2026_129b6e"             -f tests/sql/create_v3_2_08_readonly_principals.sql
          psql -X -v ON_ERROR_STOP=1 -v "manager_password=fictional_assignee_manager_2026_0bc5ea" -f tests/sql/create_v3_2_10_manager_readonly_login.sql
          psql -X -v ON_ERROR_STOP=1             -v "pass_a=fictional_access_a_2026_982a1e"             -v "pass_b=fictional_access_b_2026_819a0f"             -v "pass_m=fictional_access_manager_2026_15be2c"             -f tests/sql/create_v3_2_11_access_operator_logins.sql
          psql -X -v ON_ERROR_STOP=1             -v "write_password_a=fictional_write_a_2026_618f92"             -v "write_password_b=fictional_write_b_2026_a0c33f"             -f tests/sql/create_v3_2_12_lowrisk_writer_logins.sql
          psql -X -v ON_ERROR_STOP=1             -v "reader_password_a=fictional_viewonly_a_2026_d2ea45"             -v "reader_password_b=fictional_viewonly_b_2026_c72180"             -f tests/sql/create_directory_projection_readers.sql
          psql -X -v ON_ERROR_STOP=1 -v "directory_password=fictional_auth_directory_2026_12f4c8" -f tests/sql/create_v3_2_15_strict_auth_directory_login.sql
          psql -X -v ON_ERROR_STOP=1 -v "manager_write_password=fictional_write_manager_2026_6b31e2" -f tests/sql/create_v3_2_15_manager_function_only_writer.sql
          psql -X -v ON_ERROR_STOP=1 -v "read_m2_password=fictional_assignee_manager2_2026_d28b57" -v "write_m2_password=fictional_write_manager2_2026_f971a6" -f tests/sql/create_v3_2_23_second_manager_principals.sql
          psql -X -v ON_ERROR_STOP=1 -v "plan_password_a=fictional_plan_a_2026_abc127" -v "plan_password_sales=fictional_plan_sales_2026_def238" -v "plan_password_finance=fictional_plan_finance_2026_ghi349" -v "plan_password_academic=fictional_plan_academic_2026_jkl450" -v "plan_password_dual=fictional_plan_dual_2026_mno561" -v "plan_password_b=fictional_plan_b_2026_pqr672" -f tests/sql/create_v3_2_25_three_party_principals.sql
          psql -X -v ON_ERROR_STOP=1 -v "preflight_password=fictional_plan_preflight_2026_se719" -f tests/sql/create_v3_2_26_preflight_independent_principal.sql
          psql -X -v ON_ERROR_STOP=1 -v "security_password=fictional_source_security_2026_guard" -f tests/sql/create_v3_2_29_fixture_source_principal.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/grant_v3_2_30_fixture_recovery_functions.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/grant_v3_2_31_integration_gate_functions.sql
          psql -X -v ON_ERROR_STOP=1 -v "preview_password_a=fictional_uat_preview_a_2026" -v "preview_password_b=fictional_uat_preview_b_2026" -f tests/sql/create_v3_2_33_uat_preview_readers.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/grant_v3_2_34_fixture_evidence_reviewers.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/grant_v3_2_35_independent_freezer.sql
      - name: Restricted runtime role and forbidden finance operations
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/lowrisk_runtime_permissions.smoke.sql
      - name: Restricted actual LOGIN and tenant row-level security E2E
        run: |
          node --test tests/security/isolated-login-tenant-rls.test.mjs
          MS_REQUIRE_RESTRICTED_DB=1 DATABASE_URL="$DATABASE_URL_RESTRICTED" node --input-type=module -e "import pg from 'pg'; import {assertRestrictedRuntime} from './src/runtime-preflight.mjs'; const p=new pg.Pool({connectionString:process.env.DATABASE_URL}); await assertRestrictedRuntime(p); await p.end();"
      - name: Check frontend JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/identity.js
          node --check src/scoped-employee-read-api.mjs
          node --check src/scoped-legacy-read-adapter.mjs
          node --check src/student-access-api.mjs
          node --check web/access.js
          node --check src/scoped-lowrisk-write-api.mjs
          node --check src/scoped-lowrisk-write-server.mjs
          node --check src/scoped-legacy-write-adapter.mjs
          node --check src/strict-staff-pools.mjs
          node --check src/strict-auth-directory.mjs
          node --check src/server.mjs
          node --check src/cross-module-authority-contract.mjs
          node --check src/cross-module-fixture-source-verifier.mjs
          node --check src/integration-uat-blocker-report.mjs
          node --check src/uat-preview-api.mjs
          node --check src/uat-evidence-history.mjs
          node --check web/uat-preview.js
      - name: Core API, authorization, idempotency and Chinese audit E2E
        run: node --test --test-concurrency=1 tests/core/*.test.mjs tests/ui/*.test.mjs tests/security/*.test.mjs
      - name: Real headless Chromium workflow and responsive UI
        run: npx playwright test
      - name: Upload isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-chinese-ui-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Existing design contract regression
        run: node --test tests/contracts/contracts.test.mjs
