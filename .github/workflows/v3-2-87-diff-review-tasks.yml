name: V3.2-87 isolated difference review task queue
on:
  pull_request:
    paths:
      - 'src/cross-module-diff-review-tasks.mjs'
      - 'tests/security/v3-2-87-m02-diff-review-tasks.test.mjs'
      - '.github/workflows/v3-2-87-diff-review-tasks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-rereview-tasks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate task queue syntax
        run: node --check src/cross-module-diff-review-tasks.mjs
      - name: Validate task status, evidence change and upstream evidence diff
        run: node --test tests/security/v3-2-87-m02-diff-review-tasks.test.mjs tests/security/v3-2-86-m02-reopened-evidence-diff.test.mjs
